# check -> image -> deploy -> verify.
#
#   pull request  lint + a Docker build that is not pushed.
#   push to main  build the image, push it as :<sha>, deploy it to production (t4a) by digest and
#                 check it from outside. Only then is it tagged :latest.
#
# Pull requests go straight into main; merging one deploys production. There is no dev server
# any more (switched off 2026-11-06).
#
#   main -> production env, PROD_DEPLOY_* secrets, patrik-international.com
#
# The image is environment-neutral: NEXT_PUBLIC_MAPBOX_API_KEY is the same everywhere, and
# everything that differs (GA_MEASUREMENT_ID, secrets) comes from the server's .env at runtime.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check. On main runs are never
# cancelled, only queued, so an older commit can never be deployed over a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/time-4-action/patrik-warranty-form
  # Host port the server's compose publishes, for the health check on the VM
  # (deploy/docker-compose.t4a.yml on t4a: 4000).
  HOST_PORT: '4000'
  # Overridable with the PRODUCTION_URL repository variable.
  PUBLIC_URL: ${{ vars.PRODUCTION_URL || 'https://patrik-international.com' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

      # Pull requests only: proves the Dockerfile and `next build` (which typechecks) work before
      # merge. On main the `image` job builds anyway.
      - if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  # Produces the image to deploy as an immutable reference (image@sha256:...) plus the commit it
  # was built from, which the server and the public health check must then report.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.build.outputs.ref }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check build variables
        env:
          MAPBOX: ${{ vars.NEXT_PUBLIC_MAPBOX_API_KEY }}
        run: |
          # Baked into the image; the app refuses to boot without it.
          [ -n "$MAPBOX" ] || { echo "::error::repository variable NEXT_PUBLIC_MAPBOX_API_KEY is not set"; exit 1; }

      - id: buildpush
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          # GIT_SHA is baked in as APP_VERSION, which the server and /api/health report.
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_MAPBOX_API_KEY=${{ vars.NEXT_PUBLIC_MAPBOX_API_KEY }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: build
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
        run: |
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built $IMAGE@$DIGEST from $GITHUB_SHA"

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    # The PROD_DEPLOY_* SSH secrets are overridden on the `production` environment (t4a,
    # docs/deployment.md). GHCR needs none: the job's own GITHUB_TOKEN lets the VM pull. The
    # environment only accepts main; it can additionally require a reviewer to approve the deploy.
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # Fail loudly if the production secret is empty or not shared with this repository.
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        run: |
          [ -n "$HOST" ] || { echo "::error::PROD_DEPLOY_HOST is empty or not shared with this repository"; exit 1; }

      - uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          # The SSH login on the VM; override with the DEPLOY_USER variable.
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_DEPLOY_FINGERPRINT }}
          timeout: 30s
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -u
            # DEPLOY_DIR: a variable of the `production` environment (t4a: /srv/patrik-warranty,
            # docs/deployment.md).
            cd ${{ vars.DEPLOY_DIR || '/srv/patrik-warranty' }} || exit 1
            # Pinned by digest: exactly the image the `image` job produced, never a moved tag.
            NEW=${{ needs.image.outputs.ref }}
            VERSION=${{ needs.image.outputs.version }}
            SVC=patrik-warranty-form

            # The image the service runs now is what a failed deploy goes back to.
            PREV=""
            CID=$(docker compose ps -q $SVC 2>/dev/null || true)
            if [ -n "$CID" ]; then
              PREV=$(docker inspect --format '{{.Config.Image}}' "$CID")
            fi
            echo "running: ${PREV:-nothing}"
            echo "deploying: $NEW (commit $VERSION)"

            # /api/health pings Postgres and SMTP, so a broken .env fails here too.
            healthy() {
              for i in $(seq 1 30); do
                curl -fsS http://127.0.0.1:${{ env.HOST_PORT }}/api/health >/dev/null && return 0
                sleep 2
              done
              curl -sS http://127.0.0.1:${{ env.HOST_PORT }}/api/health || true
              return 1
            }

            # Healthy is not enough: the container must be running the image built from this
            # commit, not one left over.
            on_commit() {
              RUNNING=$(docker compose exec -T $SVC printenv APP_VERSION 2>/dev/null || true)
              echo "$SVC reports APP_VERSION=${RUNNING:-none}"
              [ "$RUNNING" = "$VERSION" ]
            }

            # The pull logs in with this job's GITHUB_TOKEN, which expires when the job ends, and
            # logs out again on every exit: the VM keeps no registry credential.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null || exit 1

            export APP_IMAGE=$NEW
            for i in 1 2 3; do
              docker compose pull $SVC && break
              [ "$i" = 3 ] && exit 1
              echo "pull failed, retrying"; sleep 10
            done

            if docker compose up -d --remove-orphans $SVC && healthy && on_commit; then
              echo "healthy on $NEW"
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi

            echo "deploy of $NEW failed"
            docker compose logs --tail=50 $SVC

            if [ -z "$PREV" ] || [ "$PREV" = "$NEW" ]; then
              echo "no previous image to roll back to"
              exit 1
            fi

            echo "rolling back to $PREV"
            export APP_IMAGE=$PREV
            if docker compose up -d $SVC && healthy; then
              echo "rolled back to $PREV"
            else
              echo "rollback is not healthy either"
              docker compose logs --tail=50 $SVC
            fi
            exit 1

  # From outside: DNS, TLS and the proxy in front of the container the deploy job already checked
  # on loopback. The public /api/health must report the commit just deployed. Only then is the
  # image tagged :latest.
  verify:
    needs: [image, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.image.outputs.ref }}
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - name: Public health check
        run: |
          for _ in $(seq 1 10); do
            BODY=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/health" 2>&1) \
              && echo "$BODY" | jq -e --arg v "$VERSION" '.status == "ok" and .version == $v' >/dev/null \
              && { echo "$BODY"; exit 0; }
            sleep 6
          done
          echo "$BODY"
          echo "::error::$PUBLIC_URL/api/health is not ok on version $VERSION"
          exit 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retags by digest; nothing is rebuilt or re-uploaded. :latest is what production runs now
      # (the server compose falls back to it).
      - name: Mark image verified
        run: docker buildx imagetools create -t "$IMAGE:latest" "$REF"
