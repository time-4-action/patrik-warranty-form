# Production compose for /srv/patrik-warranty on t4a (Hetzner; time-4-action/t4a-infra, servers/t4a).
# Save it there as docker-compose.yml, next to .env. CI exports
# APP_IMAGE=ghcr.io/time-4-action/patrik-warranty-form@sha256:<digest> (the image verified on dev);
# without it this runs :latest. The server never builds; copy changes to this file by hand.
#
# Traefik (/srv/edge) routes patrik-international.com and www here, behind Cloudflare. The old
# warranty upload links (/warranty/wp-content/uploads/arforms/userfiles/...) and assets.* go to the
# t4a bucket (hel1), not here: /srv/edge/dynamic/patrik-assets.yml in t4a-infra.
name: patrik-warranty

services:
  patrik-warranty-form:
    image: ${APP_IMAGE:-ghcr.io/time-4-action/patrik-warranty-form:latest}
    container_name: patrik-warranty-form
    # Loopback only, for CI's health check on the server (HOST_PORT in the workflow). The public
    # way in is Traefik; Docker-published ports skip ufw, so never 0.0.0.0.
    ports:
      - "127.0.0.1:4000:3000"
    # Production secrets (Sheets, S3, SMTP, Sentry, GA_MEASUREMENT_ID, ...). DATABASE_URL points at
    # postgres:5432 with this app's own role (new-app-db.sh in t4a-infra). No MAIL_REDIRECT_TO,
    # S3_KEY_PREFIX or SEED_MOCK_DATA here.
    env_file:
      - .env
    environment:
      NODE_ENV: production
    mem_limit: 512m
    networks:
      - edge
      - db
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.patrik-warranty.rule=Host(`patrik-international.com`) || Host(`www.patrik-international.com`)
      - traefik.http.routers.patrik-warranty.middlewares=patrik-warranty-headers
      - traefik.http.services.patrik-warranty.loadbalancer.server.port=3000
      # The headers nginx on t2 added.
      - traefik.http.middlewares.patrik-warranty-headers.headers.customFrameOptionsValue=SAMEORIGIN
      - traefik.http.middlewares.patrik-warranty-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.patrik-warranty-headers.headers.referrerPolicy=strict-origin-when-cross-origin
    logging:
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

networks:
  edge:
    external: true
  db:
    external: true
